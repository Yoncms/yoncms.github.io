# 网站基本配置
title: 我的GitHub个人主页
description: 这里是我分享技术、思考和创意的地方
baseurl: "" # 如果您的网站托管在子目录中，请在此处设置
url: "https://yoncms.github.io" # 您的网站URL，例如 https://username.github.io

# 作者信息
author:
  name: Yoncms | Zhangrongquan
  tagline: Coder/一切可能都不一定可能
  bio: 一名热爱编程的开发者，对技术充满好奇与探索精神。能够灵活运用它们解决实际问题，从前端页面到后端逻辑、从脚本工具到桌面应用，都乐在其中。

# 社交链接
social_links:
  github: https://github.com/yoncms
  github_username: Yoncms | Zhangrongquan
  linkedin: https://linkedin.com/in/yourprofile
  linkedin_username: Yoncms | Zhangrongquan
  twitter: https://twitter.com/yoncms
  twitter_username: yoncms
  email: banjbl@gmail.com

# 英雄区域设置
hero:
  title: 欢迎来到我的个人空间
  description: 这里是我分享技术、思考和创意的地方
  button_text: 阅读我的文章
  button_link: "#articles"

# 关于我设置，这里如果有内容，则优先显示这里的内容，否则显示_includes/about.html的内容
about:


# 联系方式设置
contact:
  description: 如果您有任何问题、合作意向或者只是想打个招呼，欢迎通过以下方式联系我：

# 评论系统设置 (Giscus - 基于GitHub Discussions)
comments:
  provider: giscus
  giscus:
    repo: Yoncms/banjbl
    repo_id: R_kgDOOr8oQA
    category: Announcements   # 替换为您选择的分类Announcements或General
    category_id: DIC_kwDOOr8oQM4CqSZ1

# 博客设置
permalink: /blog/:year/:month/:day/:title/
paginate: 10
paginate_path: "/blog/page:num/"

collections:
  articles:
    output: true

# Jekyll设置
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap
  - tag_generator

# 排除文件
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .gitignore
  - README.md

# 摘要分隔符
excerpt_separator: "<!--more-->"