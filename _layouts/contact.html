---
layout: default
---

<div class="contact-container">
  <header class="contact-header">
    <h1 class="page-title">联系我</h1>
    <p class="page-description">如果您有任何问题或合作意向，欢迎通过以下方式联系我。</p>
  </header>

  <div class="contact-content">
    <div class="contact-info">
      <div class="contact-item">
        <i class="fas fa-envelope"></i>
        <div class="contact-details">
          <h3>电子邮件</h3>
          <p>{{ site.author.email }}</p>
        </div>
      </div>
      
      <div class="contact-item">
        <i class="fab fa-github"></i>
        <div class="contact-details">
          <h3>GitHub</h3>
          <p><a href="https://github.com/{{ site.author.github }}" target="_blank">github.com/{{ site.author.github }}</a></p>
        </div>
      </div>
      
      <div class="contact-item">
        <i class="fab fa-twitter"></i>
        <div class="contact-details">
          <h3>Twitter</h3>
          <p><a href="https://twitter.com/{{ site.author.twitter }}" target="_blank">twitter.com/{{ site.author.twitter }}</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
