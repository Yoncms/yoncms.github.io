# 关于我设置
about:
  - 从接触编程起就被代码的逻辑美深深吸引，并逐步掌握了多种编程语言，如 Python、C#、JavaScript、Java、C++ 等。在不同语言和技术栈之间切换已经成为我的日常，我喜欢从底层原理理解每种语言的特性与优势，灵活地应用于不同场景中。
  - 注重 代码结构的可维护性、模块的复用性 以及 开发效率与执行性能的平衡。我相信"会写代码"和"写好代码"之间的差距，就在于是否能站在系统的角度去思考和设计。
  - Hello! My name is Yoncms, and I'm a passionate programmer with a deep love for technology and an eagerness to master diverse programming languages. 
  - Over the years, I've developed proficiency in a wide range of technologies and languages, including Python, C#, JavaScript, Java, and C++. Switching between stacks and adapting to new environments has become second nature to me.
  - I take pride in writing clean, modular, and scalable code, always striving for a balance between maintainability and performance. To me, good programming is not just about making things work—it's about crafting robust, understandable systems that can evolve over time.
  - Beyond coding, I enjoy learning from open-source projects, reading source code, and sharing knowledge through blogs, GitHub repos, and community discussions. I believe that sharing knowledge is one of the best ways to grow, and I enjoy contributing back whenever possible.
  - I also explore advanced topics such as AI APIs (e.g., OpenAI), DevOps pipelines, WebAssembly, and even compiler theory on the side. For me, programming is more than a job or a skill—it's a way of turning imagination into reality, and a lifelong pursuit of creative problem-solving.
  - Looking forward, I aim to continue expanding my horizons, tackling challenging problems, and collaborating on impactful projects. I'm excited to keep learning, building, and growing as a developer.
