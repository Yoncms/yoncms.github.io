<section id="articles">
    <div class="container">
        <h2 class="section-title">最新文章</h2>
        <div class="articles-grid">
            {% for post in site.posts limit:3 %}
            <article class="article-card">
                <div class="article-image">
                    {% if post.featured_image %}
                    <img src="{{ post.featured_image | relative_url }}" alt="{{ post.title }}">
                    {% else %}
                    <img src="{{ '/assets/images/article-default.jpg' | relative_url }}" alt="{{ post.title }}">
                    {% endif %}
                </div>
                <div class="article-content">
                    <div class="article-meta">
                        <span class="article-date">{{ post.date | date: "%Y年%m月%d日" }}</span>
                        {% if post.categories %}
                        <span class="article-category">{{ post.categories | first }}</span>
                        {% endif %}
                    </div>
                    <h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
                    <p>{{ post.excerpt | strip_html | truncatewords: 30 }}</p>
                    <a href="{{ post.url | relative_url }}" class="read-more">阅读全文 <i class="fas fa-arrow-right"></i></a>
                </div>
            </article>
            {% endfor %}
        </div>
        <div class="view-all-container">
            <a href="{{ '/blog/' | relative_url }}" class="btn">查看所有文章</a>
        </div>
    </div>
</section>
